<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/general.css" />
    <link rel="stylesheet" href="./css/shared/header.css" />
    <link rel="stylesheet" href="./css/pages/order.css" />
  </head>
  <body>
    <div class="header">
      <div class="logo">
        <a href="">
          <img class="logo-desktop" src="images/amazon-logo-white.png" alt="" />
          <img class="logo-mobile" src="images/amazon-mobile-logo-white.png" />
        </a>
      </div>
      <div class="search-box">
        <input type="text" class="search-input" placeholder="Search" /><button
          class="btn-search"
        >
          <img src="images/icons/search-icon.png" alt="" />
        </button>
      </div>
      <div class="order-box-desktop">
        <a href="" class="return-order"
          ><span class="text-white text-sm">Returns</span>
          <p class="text-bold text-white">& Orders</p></a
        >
        <a href="" class="cart">
          <div class="cart-icon">
            <p class="quantity-cart">2</p>
            <img src="images/icons/cart-icon.png" alt="" />
          </div>
          <div class="cart-text text-white text-bold"><p>Cart</p></div>
        </a>
      </div>
      <div class="order-box-mobile">
        <img
          class="hamburger-icon"
          src="./images/icons/hamburger-menu.png"
          alt=""
        />
      </div>
      <div class="hamburger-menu-dropdown">
        <a href="">Returns & Orders</a>
        <a href="">Cart (<span class="cart-quantity">4</span>)</a>
      </div>
    </div>
    <div class="main-content"></div>
  </body>
</html>
